[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-ratelimit-registry"
version = "2.0.0"
description = "Machine-readable registry, proactive tracker, CLI, and zero-dependency parser for HTTP API rate-limit headers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
open-ratelimit = "open_ratelimit_registry.cli:main"

[tool.setuptools.package-data]
open_ratelimit_registry = ["registry.json"]
