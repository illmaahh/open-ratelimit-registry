id: vercel
name: Vercel REST API
category: cloud
source_url: https://vercel.com/docs/rest-api
last_verified: "2026-11-23"
detect_headers:
  - x-vercel-id
buckets:
  - name: requests
    unit: requests
    format: triplet
    limit_header: x-ratelimit-limit
    remaining_header: x-ratelimit-remaining
    reset_header: x-ratelimit-reset
    reset_format: epoch_seconds
retry:
  status_codes: [429]
  retry_after_header: retry-after
  retry_after_format: seconds
  strategy: honor_retry_after
  default_backoff_ms: 10000
  notes: "Vercel emits X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset (Unix epoch seconds), and Retry-After on 429."
examples:
  - description: "Vercel API response with remaining quota"
    status: 200
    headers:
      x-vercel-id: "iad1::abc123"
      x-ratelimit-limit: "100"
      x-ratelimit-remaining: "88"
      x-ratelimit-reset: "1795443660"
    expected:
      is_limited: false
      limit: 100
      remaining: 88
      retry_after_ms: null
