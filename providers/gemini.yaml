id: gemini
name: Google Gemini API
category: ai
source_url: https://ai.google.dev/gemini-api/docs/rate-limits
last_verified: "2026-11-23"
detect_headers: []
buckets: []
retry:
  status_codes: [429, 503]
  retry_after_header: retry-after
  retry_after_format: seconds
  strategy: exponential_backoff_jitter
  default_backoff_ms: 4000
  notes: "Returns HTTP 429 (RESOURCE_EXHAUSTED) or transient 503; honor Retry-After when present or apply jittered exponential backoff."
examples:
  - description: "Gemini 429 with Retry-After"
    status: 429
    headers:
      retry-after: "8"
    expected:
      is_limited: true
      limit: null
      remaining: null
      retry_after_ms: 8000
