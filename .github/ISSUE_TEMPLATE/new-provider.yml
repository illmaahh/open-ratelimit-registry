name: Add API Provider Spec
description: Request or claim a new API rate-limit specification
labels: ["good first issue", "provider"]
body:
  - type: input
    id: provider
    attributes:
      label: Provider Name & ID
      placeholder: e.g. Linear (linear)
    validations:
      required: true
  - type: input
    id: docs
    attributes:
      label: Official Rate-Limit Documentation URL
      placeholder: https://...
    validations:
      required: true
