name: Validate & Test Registry

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install PyYAML
        run: pip install pyyaml jsonschema
      - name: Validate provider YAMLs
        run: python3 scripts/validate_providers.py
      - name: Check registry.json and README.md are up to date
        run: |
          python3 scripts/build_registry.py
          git diff --exit-code packages/ README.md
      - name: Run Python unit tests
        run: python3 -m unittest discover -s packages/python/tests -v
      - name: Run JS unit tests
        run: node --test packages/js/test/parser.test.mjs
      - name: Verify cross-language Python/JS parity
        run: python3 scripts/verify_parity.py
      - name: Smoke-test Python and JS CLIs
        run: |
          printf "HTTP/2 429\r\nretry-after: 5\r\ncf-ray: test-IST\r\n\r\n" | PYTHONPATH=packages/python python3 -m open_ratelimit_registry inspect --json
          printf "HTTP/2 429\r\nretry-after: 5\r\ncf-ray: test-IST\r\n\r\n" | node packages/js/bin/cli.mjs inspect --json
