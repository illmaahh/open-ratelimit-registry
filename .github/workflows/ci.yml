name: Validate & Test Registry

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate provider YAMLs
        run: python3 scripts/validate_providers.py
      - name: Check registry.json is up to date
        run: |
          python3 scripts/build_registry.py
          git diff --exit-code packages/
      - name: Run Python tests
        run: python3 -m unittest discover -s packages/python/tests -v
      - name: Run JS tests
        run: node --test packages/js/test/parser.test.mjs
